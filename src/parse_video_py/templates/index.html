<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%237c6cff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2338d8d4%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url(%23g)%22%2F%3E%3Cpath%20d%3D%22M25%2019%20L45%2032%20L25%2045%20Z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">

<title>{{ title }}</title>
<style>
:root{
  --bg0:#07090f;--bg1:#0b0e17;--bg2:#0f141f;
  --card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.18);
  --text:#eef1f8;--dim:#9aa3b8;--muted:#6a7284;
  --acc:#7c6cff;--acc2:#38d8d4;--blue:#5b8cff;
  --grad:linear-gradient(135deg,#8b7bff 0%,#5b8cff 48%,#38d8d4 100%);
  --green:#34d399;--red:#fb7185;--yellow:#fbbf24;
  --radius:20px;--radius-s:12px;
  --shadow:0 24px 60px -24px rgba(0,0,0,.65);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg0);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;line-height:1.6;overflow-x:hidden;
}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0}
.glow::before,.glow::after{content:"";position:absolute;border-radius:50%;filter:blur(100px)}
.glow::before{width:560px;height:560px;background:radial-gradient(circle,rgba(124,108,255,.32),transparent 70%);top:-180px;left:-140px}
.glow::after{width:460px;height:460px;background:radial-gradient(circle,rgba(56,216,212,.26),transparent 70%);bottom:-140px;right:-120px}
.wrap{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:clamp(24px,4vw,50px) 20px 60px}
.hero{text-align:center;padding:clamp(24px,6vw,56px) 0 28px}
.badge{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
  letter-spacing:.18em;color:var(--acc2);text-transform:uppercase;
  background:linear-gradient(90deg,rgba(124,108,255,.14),rgba(56,216,212,.14));
  border:1px solid rgba(124,108,255,.28);border-radius:999px;padding:6px 15px;margin-bottom:20px;
}
.hero h1{
  font-size:clamp(28px,5.4vw,46px);line-height:1.12;font-weight:800;letter-spacing:-.02em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero .sub{color:var(--dim);font-size:clamp(13px,3vw,15px);margin-top:13px;max-width:560px;margin-left:auto;margin-right:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--border);padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.02);transition:.2s;cursor:default}
.chip:hover{border-color:var(--border2);color:var(--text);transform:translateY(-1px)}
.chip.hot{color:var(--acc2);border-color:rgba(56,216,212,.35);background:rgba(56,216,212,.08)}
.chip.more{color:var(--muted);border-style:dashed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.console{padding:clamp(18px,3.6vw,28px);margin-bottom:30px}
.console-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.console-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px rgba(124,108,255,.12)}
.tip{font-size:12px;color:var(--muted)}
textarea{
  width:100%;min-height:132px;background:#0b0e17;border:1px solid var(--border);
  border-radius:var(--radius-s);color:var(--text);padding:14px;font-size:14px;
  font-family:inherit;line-height:1.75;resize:vertical;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
textarea:focus{border-color:rgba(91,140,255,.6);box-shadow:0 0 0 3px rgba(91,140,255,.13)}
textarea::placeholder{color:var(--muted)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--grad);color:#fff;border:none;border-radius:var(--radius-s);
  padding:11px 22px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700;
  transition:transform .15s,box-shadow .2s,filter .2s;
  box-shadow:0 10px 26px -10px rgba(124,108,255,.6);white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 14px 32px -10px rgba(124,108,255,.7)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;filter:none}
.btn.gray{background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--border);font-weight:600;box-shadow:none}
.btn.gray:hover{border-color:var(--border2);color:var(--text)}
.btn.green{background:linear-gradient(135deg,#34d399,#10b981);color:#052e21;box-shadow:0 10px 26px -10px rgba(52,211,153,.5)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px;font-weight:600}
.count{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.status{font-size:13px;color:var(--dim);margin-top:14px;min-height:20px;transition:color .2s}
.status.ok{color:var(--green)}
.status.err{color:var(--red)}
.progress{height:5px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:12px;display:none;position:relative}
.progress.on{display:block}
.progress .bar{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc));background-size:200% 100%;border-radius:99px}
@keyframes fill{0%{width:4%}55%{width:66%}100%{width:92%}}
@keyframes shimmer{0%{background-position:0 0}100%{background-position:200% 0}}
.progress.on .bar{animation:fill 1.4s ease forwards,shimmer 1.1s linear infinite}
.results-head{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.results-head h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.results-head .star{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.results-head .idx{font-size:12px;color:var(--dim);font-weight:400;margin-left:auto}
.item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow);transition:border-color .2s}
.item:hover{border-color:var(--border2)}
.item .hd{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tag{flex:none;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:linear-gradient(135deg,rgba(124,108,255,.18),rgba(56,216,212,.16));color:#c9d8ff;border:1px solid rgba(124,108,255,.3);margin-top:2px}
.tinfo{flex:1;min-width:200px}
.item .tt{font-size:15px;font-weight:700;line-height:1.4}
.item .au{font-size:12px;color:var(--muted);margin-top:3px}
.item .bd{padding:18px}
.videobox{position:relative;border-radius:12px;overflow:hidden;background:#000;margin-bottom:14px;border:1px solid var(--border)}
.videobox video{width:100%;max-height:440px;display:block;background:#000}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.imggrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;transition:transform .2s;border:1px solid var(--border)}
.imggrid img:hover{transform:scale(1.05)}
.linkbox{display:flex;align-items:center;gap:10px;background:#0b0e17;border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-top:14px}
.link-ellipsis{flex:1;font-size:12px;color:var(--acc2);word-break:break-all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.errbox{background:rgba(251,113,133,.06);border:1px solid rgba(251,113,133,.3);border-radius:var(--radius);margin-bottom:16px;padding:16px 18px}
.errbox .et{color:var(--red);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.errbox .ex{color:var(--dim);font-size:12px;margin-top:8px;word-break:break-all}
.errbox .ex2{color:var(--muted);font-size:12px;margin-top:4px;word-break:break-all}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty .big{font-size:46px;margin-bottom:16px}
.empty .t{font-size:16px;font-weight:700;color:var(--dim)}
.empty .d{font-size:13px;margin-top:7px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:48px;line-height:1.9}
footer .sep{color:var(--border2);margin:0 7px}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:100;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast{background:#121620;border:1px solid var(--border2);color:var(--text);padding:11px 20px;border-radius:12px;font-size:13px;box-shadow:0 14px 34px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;max-width:90vw}
.toast.ok{border-color:rgba(52,211,153,.4)}
.toast.err{border-color:rgba(251,113,133,.4)}
.toast .ico{font-size:16px}
@media(max-width:640px){
  .hero h1{font-size:29px}
  .tip{display:none}
  .item .hd{flex-direction:column;align-items:flex-start}
  .imggrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  #btnParse{flex:1 0 100%;order:-1}
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <header class="hero">
    <div class="badge">✦ 视频工具箱</div>
    <h1>视频去水印解析</h1>
    <p class="sub">粘贴分享链接，自动识别平台并解析无水印直链 · 支持批量解析</p>
    <div class="chips" id="chips"></div>
  </header>

  <section class="card console">
    <div class="console-top">
      <div class="console-title"><span class="dot"></span> 解析工作台</div>
      <div class="tip">支持多行解析 · Ctrl / ⌘ + Enter 快捷开始</div>
    </div>
    <textarea id="input" placeholder="粘贴分享链接，支持多行批量&#10;例如：&#10;https://v.douyin.com/xxxx/&#10;https://www.bilibili.com/video/BVxxxx&#10;https://xhslink.com/xxxx"></textarea>
    <div class="row">
      <button class="btn" id="btnParse">⚡ 开始解析</button>
      <button class="btn gray" id="btnPaste">📋 粘贴</button>
      <button class="btn gray" id="btnClear">✕ 清空</button>
      <span class="grow"></span>
      <span class="count" id="count"></span>
    </div>
    <div class="status" id="status"></div>
    <div class="progress" id="progress"><div class="bar"></div></div>
  </section>

  <div class="results-head">
    <h2><span class="star">✦</span> 解析结果</h2>
    <span class="idx" id="resIdx"></span>
  </div>
  <div id="results">
    <div class="empty">
      <div class="big">🎬</div>
      <div class="t">还没有解析结果</div>
      <div class="d">在上方粘贴你要解析的分享链接，点击「开始解析」即可查看无水印直链</div>
    </div>
  </div>

  <footer>
    仅用于解析各平台公开分享内容 · 请遵守各平台服务条款<span class="sep">|</span>本地免费工具
  </footer>
</div>
<div id="toast"></div>
<script>
var $=function(s){return document.querySelector(s)};
var input=$('#input'),results=$('#results'),btn=$('#btnParse'),countEl=$('#count'),statusEl=$('#status'),resIdx=$('#resIdx');
var PLATFORM_REFERER={
  "douyin":"https://www.douyin.com/",
  "kuaishou":"https://www.kuaishou.com/",
  "bilibili":"https://www.bilibili.com/",
  "xigua":"https://www.ixigua.com/",
  "redbook":"https://www.xiaohongshu.com/",
  "weibo":"https://weibo.com/",
  "xiaohongshu":"https://www.xiaohongshu.com/",
  "tiktok":"https://www.tiktok.com/",
  "instagram":"https://www.instagram.com/"
};
function refererFor(u){for(var k in PLATFORM_REFERER){if(u.indexOf(k)>=0)return PLATFORM_REFERER[k];}return "";}
function safeTitle(t){if(!t)return "video";return t.replace(/[\\/:*?"<>|#%\s]+/g,"_").replace(/_+/g,"_").slice(0,80)||"video";}
function downloadUrl(u,filename){var a=document.createElement("a");a.href=u;a.download=filename||"";a.target="_blank";document.body.appendChild(a);a.click();a.remove();}
function extFromUrl(u){var x=(u.split("?")[0]||"").toLowerCase();var m=x.match(/\.(mp4|webm|jpg|jpeg|png|gif|webp|mov|m3u8)$/);return m?m[1]:null;}
function showMsg(text,cls){statusEl.textContent=text;statusEl.className="status"+(cls?(" "+cls):"");}
function setProgress(show){var p=$('#progress');if(!p)return;if(show){p.classList.add("on");}else{p.classList.remove("on");}}
var toastTimer;
function toast(text,type,icon){var box=$('#toast');if(!box)return;box.innerHTML="";var t=document.createElement("div");t.className="toast"+(type?(" "+type):"");t.innerHTML='<span class="ico">'+(icon||"")+'</span><span>'+escapeHtml(text)+'</span>';box.appendChild(t);box.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){box.classList.remove("show");},2600);}
function escapeHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyText(t){if(!t)return;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("直链已复制","ok","📋");},function(){legacyCopy(t);});}else{legacyCopy(t);}}
function legacyCopy(t){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("直链已复制","ok","📋");}catch(e){toast("复制失败","err","⚠️");}ta.remove();}
function detectPlatformName(u){
  var rules=[["douyin","抖音"],["kuaishou","快手"],["bilibili","B站"],["xigua","西瓜视频"],
    ["xiaohongshu","小红书"],["weibo","微博"],["tiktok","TikTok"],["instagram","Instagram"],
    ["pearvideo","梨视频"],["pipix","皮皮虾"],["huya","虎牙"],["v.qq.com","腾讯视频"],
    ["sohu","搜狐"],["acfun","AcFun"],["kg.qq.com","全民K歌"],["haokan","好看视频"]];
  for(var i=0;i<rules.length;i++){if((u||"").indexOf(rules[i][0])>=0)return rules[i][1];}
  return "视频";
}
function renderEmpty(){results.innerHTML='<div class="empty"><div class="big">🎬</div><div class="t">还没有解析结果</div><div class="d">在上方粘贴你要解析的分享链接，点击「开始解析」即可查看无水印直链</div></div>';}
function renderItem(item){
  var d=item.data||{},el=document.createElement("div");
  el.className="item";
  var platform=detectPlatformName(item.raw);
  var author=d.author||{};
  var hasVideo=!!d.video_url,hasImages=(d.images&&d.images.length>0),hasMusic=!!d.music_url;
  var dirLink=d.video_url||(d.images&&d.images[0]&&d.images[0].url)||"";
  var media="";
  if(hasVideo){media+='<div class="videobox"><video controls preload="metadata" playsinline src="'+escapeHtml(d.video_url)+'"'+((d.cover_url)?(' poster="'+escapeHtml(d.cover_url)+'"'):'')+'></video></div>';}
  if(hasImages){media+='<div class="imggrid">';d.images.forEach(function(img){media+='<img loading="lazy" src="'+escapeHtml(img.url)+'" onclick="window.open(\''+escapeHtml(img.url)+'\',\'_blank\')">';});media+='</div>';}
  var actions="";
  if(hasVideo)actions+='<button class="btn sm" data-a="dlv"><span>⬇</span> 下载视频</button>';
  if(hasImages)actions+='<button class="btn sm green" data-a="dli"><span>🖼</span> 打包图片</button>';
  if(hasMusic)actions+='<button class="btn sm gray" data-a="dlm"><span>🎵</span> 下载音乐</button>';
  if(d.cover_url)actions+='<button class="btn sm gray" data-a="dlc"><span>🖼</span> 封面</button>';
  var linkbox="";
  if(dirLink){linkbox='<div class="links"><div class="linkbox"><span class="link-ellipsis">'+escapeHtml(dirLink)+'</span><button class="btn sm gray" data-a="copy2">复制</button></div></div>';}
  el.innerHTML='<div class="hd">'
    +'<span class="tag">'+platform+'</span>'
    +'<div class="tinfo"><div class="tt">'+escapeHtml(d.title||"(无标题)")+'</div>'
    +'<div class="au">'+(author.name?("@"+escapeHtml(author.name)):"未署名")+'</div></div>'
    +'</div>'
    +'<div class="bd">'+media
    +'<div class="row">'+actions+'</div>'
    +linkbox
    +'</div>';
  var ref=refererFor(item.raw||d.video_url||"");
  var b=el.querySelector('[data-a="dlv"]');if(b)b.addEventListener("click",function(){dlProxy(d.video_url,safeTitle(d.title)+".mp4",ref);});
  var mu=el.querySelector('[data-a="dlm"]');if(mu)mu.addEventListener("click",function(){dlProxy(d.music_url,safeTitle(d.title)+"_music.mp3",ref);});
  var c=el.querySelector('[data-a="dlc"]');if(c)c.addEventListener("click",function(){dlProxy(d.cover_url,safeTitle(d.title)+"_cover.jpg",ref);});
  var im=el.querySelector('[data-a="dli"]');if(im)im.addEventListener("click",function(){dlImagesZip(d);});
  var cp2=el.querySelector('[data-a="copy2"]');if(cp2)cp2.addEventListener("click",function(){copyText(dirLink);});
  return el;
}
function renderResults(list){results.innerHTML="";list.forEach(function(item){if(!item.ok){var de=document.createElement("div");de.className="errbox";de.innerHTML='<div class="et"><span>🚫</span> 解析失败</div><div class="ex">'+escapeHtml(item.raw||"")+'</div><div class="ex2">'+escapeHtml(item.msg||"解析失败")+'</div>';results.appendChild(de);return;}results.appendChild(renderItem(item));});}
function dlProxy(url,filename,referer){
  if(!url)return;
  toast("正在开始下载…","","⬇");
  var dl="/video/download/direct?url="+encodeURIComponent(url)+"&referer="+encodeURIComponent(referer||"");
  downloadUrl(dl,filename);
  setTimeout(function(){toast("已开始下载，请查看浏览器下载列表","ok","✅");},800);
}
async function dlImagesZip(d){
  var imgs=d.images||[];
  if(!imgs.length){toast("无图片可下载","err","⚠️");return;}
  showMsg("正在打包 "+imgs.length+" 张图片…","");
  try{
    var fetchAll=imgs.map(function(img,i){
      return fetch("/video/download/direct?url="+encodeURIComponent(img.url)+"&referer="+encodeURIComponent("https://www.xiaohongshu.com/"))
        .then(async function(r){var buf=await r.arrayBuffer();var ext=extFromUrl(img.url)||"jpg";return {name:"image_"+String(i+1).padStart(3,"0")+"."+ext,buf:buf};});
    });
    var files=await Promise.all(fetchAll);
    var zip=await zipFiles(files);
    downloadUrl(URL.createObjectURL(zip),safeTitle(d.title)+"_images.zip");
    showMsg("已打包 "+files.length+" 张图片并开始下载","ok");
    toast("已打包 "+files.length+" 张图片","ok","🖼");
  }catch(e){
    showMsg("打包失败："+e.message,"err");
    toast("打包失败：网络异常","err","❌");
  }
}
async function zipFiles(files){
  if(window.showSaveFilePicker){
    try{
      var handles=[];
      for(var i=0;i<files.length;i++){var h=await window.showSaveFilePicker({suggestedName:files[i].name});var w=await h.createWritable();await w.write(files[i].buf);await w.close();handles.push(h);}
      if(handles.length)return new Blob([]);
    }catch(e){}
  }
  files.forEach(function(f){var blob=new Blob([f.buf]);var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();});
  return new Blob([]);
}
async function runParse(){
  var text=input.value.trim();
  if(!text){showMsg("请先粘贴分享链接","err");toast("请先粘贴分享链接","err","⚠️");return;}
  var lines=text.split(/\n+/).filter(function(s){return s.trim();}).length;
  showMsg("正在解析 "+lines+" 条链接…","");
  btn.disabled=true;var paste=$('#btnPaste');if(paste)paste.disabled=true;
  setProgress(true);results.innerHTML="";
  try{
    var r=await fetch("/video/share/url/parse/batch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text})});
    var j=await r.json();
    if(j.code!==200){showMsg("解析失败："+j.msg,"err");toast("解析失败："+j.msg,"err","❌");return;}
    var d=j.data;
    countEl.textContent="共 "+d.total+" 条 · 成功 "+d.success+" · 失败 "+d.failed;
    if(resIdx)resIdx.textContent="共 "+d.total+" 条";
    if(d.success>0&&d.failed===0){showMsg("解析完成，已全部成功","ok");toast("解析完成","ok","✅");}
    else if(d.success>0){showMsg("成功 "+d.success+" / 失败 "+d.failed+"，失败项已标红","err");toast("部分解析成功（失败 "+d.failed+"）","err","⚠️");}
    else{showMsg("全部解析失败，请检查链接是否有效","err");toast("全部解析失败，请检查链接","err","❌");}
    renderResults(d.results);
    if(results.firstChild&&results.firstChild.scrollIntoView){results.scrollIntoView({behavior:"smooth",block:"nearest"});}
  }catch(e){
    showMsg("请求失败："+e.message,"err");
    toast("请求失败：网络异常","err","❌");
  }finally{
    btn.disabled=false;var paste2=$('#btnPaste');if(paste2)paste2.disabled=false;setProgress(false);
  }
}
btn.addEventListener("click",runParse);
input.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="Enter")runParse();});
$('#btnPaste').addEventListener("click",async function(){
  try{var t=await navigator.clipboard.readText();if(t){input.value=(input.value?input.value.trim()+"\n":"")+t;toast("已粘贴剪贴板内容","ok","📋");}else{toast("剪贴板为空","err","⚠️");}}
  catch(_){toast("无法读取剪贴板，请手动粘贴","err","⚠️");}
});
$('#btnClear').addEventListener("click",function(){input.value="";countEl.textContent="";renderEmpty();showMsg("");});
(function loadPlatforms(){
  fetch("/platforms").then(function(r){return r.json();}).then(function(j){
    if(j.code===200){
      var chips=$('#chips');chips.innerHTML="";
      var count=j.data.length;
      var countChip=document.createElement("div");countChip.className="chip hot";countChip.textContent="✦ 已支持 "+count+" 个平台";chips.appendChild(countChip);
      j.data.slice(0,14).forEach(function(d){var el=document.createElement("div");el.className="chip";el.textContent=d.source;chips.appendChild(el);});
      if(count>14){var more=document.createElement("div");more.className="chip more";more.textContent="+"+(count-14);chips.appendChild(more);}
    }
  }).catch(function(){});
})();
</script>
</body>
</html>
